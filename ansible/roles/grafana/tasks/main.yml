---
- name: Add the Grafana repo key
  ansible.builtin.apt_key:
    url: https://apt.grafana.com/gpg.key
    state: present

- name: Add the Grafana repository
  ansible.builtin.apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

- name: Set the Grafana admin password
  ansible.builtin.command:
    argv:
      - grafana-cli
      - --homepath
      - /usr/share/grafana
      - admin
      - reset-admin-password
      - "{{ vault_grafana_admin_password }}"
  register: grafana_pw_result
  changed_when: "'Admin password changed successfully' in grafana_pw_result.stdout"
  failed_when: grafana_pw_result.rc != 0
  become: true
  no_log: true